x-arena: &arena
  build: .
  working_dir: /workspace/gpgpu-arena
  volumes:
    - .:/workspace/gpgpu-arena
    - kernel-cache:/workspace/gpgpu-arena/build/kernels
  entrypoint: ["/workspace/gpgpu-arena/docker/entrypoint.sh"]
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Headless CLI. Arguments pass straight through to the binary:
  #
  #   docker compose run --rm cli --list
  #   docker compose run --rm cli --run reduce -p n=4000000 --runs 20
  #   docker compose run --rm cli --run all --profile --format csv -o results.csv
  #
  # stdout carries only the payload, so piping works (-T disables the TTY):
  #   docker compose run --rm -T cli --run cub_reduce | jq .results[0].timing
  cli:
    <<: *arena
    command: ["--help"]

  # Interactive shell in the same environment, for poking around.
  shell:
    <<: *arena
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

  # GUI. Run `xhost +local:docker` on the host first.
  gui:
    <<: *arena
    # Repeats the anchor's volumes on purpose: a YAML merge key replaces the
    # whole `volumes` list rather than appending to it, so the X11 socket
    # cannot simply be added here.
    volumes:
      - .:/workspace/gpgpu-arena
      - kernel-cache:/workspace/gpgpu-arena/build/kernels
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __NV_PRIME_RENDER_OFFLOAD=1
    command: ["--gui"]
    stdin_open: true
    tty: true
    network_mode: host

volumes:
  kernel-cache:
